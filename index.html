<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=tvet-dashboard.html" />
  <title>Akuakultur — TVET Water Quality Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f0f4f8;
      color: #1f2328;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 40px 48px;
      max-width: 420px;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 700; color: #1e3a5f; margin-bottom: 8px; }
    p  { font-size: 14px; color: #57606a; line-height: 1.6; margin-bottom: 24px; }
    a.btn {
      display: inline-block;
      background: #1e3a5f;
      color: #fff;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    a.btn:hover { background: #2563eb; }
    .note { font-size: 12px; color: #57606a; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌊</div>
    <h1>TVET Water Quality Dashboard</h1>
    <p>Aquaculture daily water quality monitoring system for temperature, pH, dissolved oxygen, ammonia and turbidity.</p>
    <a class="btn" href="tvet-dashboard.html">Open Dashboard →</a>
    <p class="note">Redirecting automatically…</p>
  </div>
